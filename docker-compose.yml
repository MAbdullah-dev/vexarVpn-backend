services:
  postgres:
    image: postgres:16-alpine
    container_name: vexar-vpn-postgres
    environment:
      POSTGRES_USER: vexar
      POSTGRES_PASSWORD: vexar
      POSTGRES_DB: vexar_vpn
    ports:
      - "5432:5432"
    volumes:
      - vexar_vpn_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vexar -d vexar_vpn"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vexar_vpn_postgres:
